name: Deploy Sparkmote to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Add .nojekyll
        run: touch ./Sparkmote/.nojekyll

      - name: Stamp build time
        run: |
          STAMP="$(TZ=Europe/Amsterdam date +'%Y-%m-%d %H:%M')"
          sed -i "s/__BUILD_TIME__/${STAMP}/g" ./Sparkmote/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./Sparkmote

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
