name: Deploy Buzzer to GitHub Pages

on:
  push:
    branches: ["master", "main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Assemble Pages site
        run: |
          # The app stays at the Pages root (unchanged public URL).
          mkdir -p ./site
          cp -r ./Buzzer/. ./site/
          # The landing site lives at /buzzer-home/.
          mkdir -p ./site/buzzer-home
          cp -r ./buzzer-home/. ./site/buzzer-home/
          touch ./site/.nojekyll

      - name: Stamp build time
        run: |
          STAMP="$(TZ=Europe/Amsterdam date +'%Y-%m-%d %H:%M')"
          sed -i "s/__BUILD_TIME__/${STAMP}/g" ./site/index.html
          sed -i "s/__BUILD_TIME__/${STAMP}/g" ./site/development/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
