<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 220" width="800" height="220" role="img" aria-label="Buzzer OSSM Remote by Volt Labs">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1f5f9"/>
    </linearGradient>
    <radialGradient id="btn" cx="0.38" cy="0.32" r="1.05">
      <stop offset="0" stop-color="#ffc45e"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#e11d48"/>
    </radialGradient>
    <linearGradient id="bz" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#e11d48"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="1" stop-color="#be123c"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g transform="translate(24,30) scale(0.3125)">
    <rect width="512" height="512" rx="116" fill="url(#bg)"/>
    <rect x="8" y="8" width="496" height="496" rx="108" fill="none" stroke="#e2e8f0" stroke-width="2"/>
    <path d="M256 96 A160 160 0 0 0 256 416" fill="none" stroke="url(#bz)" stroke-width="22" stroke-linecap="round"/>
    <path d="M256 56 A200 200 0 0 0 256 456" fill="none" stroke="url(#bz)" stroke-width="22" stroke-linecap="round" opacity="0.5"/>
    <path d="M256 96 A160 160 0 0 1 256 416" fill="none" stroke="url(#bz)" stroke-width="22" stroke-linecap="round"/>
    <path d="M256 56 A200 200 0 0 1 256 456" fill="none" stroke="url(#bz)" stroke-width="22" stroke-linecap="round" opacity="0.5"/>
    <circle cx="256" cy="256" r="112" fill="url(#btn)" filter="url(#glow)"/>
    <g transform="translate(256 256) scale(0.5) translate(-256 -256)">
